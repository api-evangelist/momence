aid: momence
name: Momence
review:
  question: Does Momence expose a documented public WebSocket API?
  answer: false
  date: '2026-07-04'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Momence's documented public API surface
    (the /api/v2 Host API and Member API at api.momence.com) is request/response
    REST over HTTPS, authenticated with OAuth2. The published OpenAPI schema
    (https://static.momence.com/schema/api-v2-schema.yaml) defines only REST
    paths and OAuth2 security schemes - there is no server-push transport
    (WebSocket or SSE) and no callbacks/webhook objects on Momence's own public
    API to model. There is therefore no realtime protocol surface for an
    AsyncAPI document to describe.
findings:
  summary: |
    Momence publishes a documented public REST API. It is a management platform
    for fitness, wellness, and experience-based businesses (studios, gyms, spas,
    instructors). The Public API lives at base https://api.momence.com under
    /api/v2 and is split into a Host API (staff / back-office, aligned with
    dashboard permissions) and a Member API (scoped to the currently logged-in
    customer). Authentication is OAuth2: an authorization code grant that
    redirects customers to a Momence login screen, a password grant reserved for
    staff automation, and refresh tokens; access tokens are short-lived. API
    access is enabled by creating public API clients (client_id / client_secret)
    in the Momence dashboard under Apps & Integrations > Developer API. The
    documented surface covers members, sessions and bookings, memberships,
    checkout / sales / reports, appointments, addresses, and saved payment
    methods. No documented public WebSocket (ws:// or wss://) endpoint exists on
    Momence's own API.
  openSource: |
    Momence is a proprietary commercial SaaS platform. The API is a partner /
    integration surface gated by dashboard-created OAuth2 public API clients,
    not an open-source project. There is no public Momence GitHub organization
    that hosts the platform or an official SDK as of the review date.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.momence.com/api/v2
      documented: true
      note: Host API and Member API. OAuth2-authenticated request/response REST defined in the published OpenAPI schema.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in the Momence Public API docs or OpenAPI schema as of the review date.
    - protocol: Webhook
      scheme: https
      documented: false
      note: >-
        Webhooks are referenced informally in the developer hub, but the public
        v2 OpenAPI schema defines no webhook/callback objects and no registration
        endpoint. Not modeled as a documented public artifact here.
