actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on Momence's own public API. The
    documented API is OAuth2-authenticated request/response REST (Host API and
    Member API under /api/v2), defined in the published OpenAPI schema. No
    AsyncAPI document was created because there is no server-push transport
    (WebSocket, SSE) or documented webhook/callback surface on Momence's own API
    to model.
