description: >-
  FinOps view of Momence spend. Momence is a SaaS platform billed as a tiered
  monthly software subscription, with per-transaction payment processing and
  platform fees layered on top of card and ACH transactions, plus optional
  add-ons (marketing, branded app, extra staff/locations). The Public API is
  included in the platform subscription rather than metered separately, so API
  cost is effectively the subscription tier that unlocks it. The dominant
  variable cost for most operators is payment processing on member transactions.
notes: >-
  Per-tier subscription prices and processing rates vary by region and change
  over time; the figures in the plans artifact are indicative third-party
  reports, not reconciled Momence rates. Verify on the Momence pricing page.
