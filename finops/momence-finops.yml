meters:
- name: subscription_fee
  description: Monthly platform subscription fee for the chosen Momence tier.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: platform_transaction_fee
  description: Per-transaction platform fee charged on member payments, varying by plan tier.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - plan
- name: card_processing_fee
  description: Payment processing fee on card transactions (percentage plus fixed amount), online and in-person.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
  - channel
- name: ach_processing_fee
  description: Processing fee on ACH / direct-debit transactions.
  unit: transactions
  aggregation: sum
  dimensions:
  - account
- name: add_on_fees
  description: Optional add-ons such as marketing, the branded member app, and extra staff or locations.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - addon
principles:
- name: Visibility
  description: Track the monthly subscription tier plus payment-processing and platform fees on member transactions; reconcile against Momence sales and reports data pulled via the API.
- name: Allocation
  description: Map fees to locations, programs, or teams using member tags, sessions, and sales metadata.
- name: Optimization
  description: Choose the tier whose lower platform fee offsets its higher base fee at your transaction volume; encourage lower-cost payment rails (e.g., ACH) where appropriate; prune unused add-ons.
- name: Accountability
  description: Assign an owner for the Momence subscription and processing spend; review monthly against membership revenue.
