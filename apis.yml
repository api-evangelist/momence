  name: Momence Authentication API
  tags:
  - Authentication
  - OAuth2
  - Identity
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api.docs.momence.com/docs/authorization
