  description: OAuth2 authorization and token endpoints for the Momence Public API.
    Supports the authorization code grant (redirecting customers to a Momence login
    screen), the password grant for staff automation, and refresh tokens, plus
    endpoints to fetch the logged-in user profile and log out. Public API clients
    (client_id / client_secret) are created in the Momence dashboard.
