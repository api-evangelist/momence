aid: momence
url: https://raw.githubusercontent.com/api-evangelist/momence/refs/heads/main/apis.yml
name: Momence
kind: company
description: Momence is an all-in-one management platform for fitness, wellness, and
  experience-based businesses - studios, gyms, spas, and instructors - covering class
  and appointment scheduling, memberships and packages, point-of-sale and payments,
  marketing, and a branded member app. Momence exposes a documented public REST API
  (api.momence.com, /api/v2) split into a Host API for staff and back-office
  automation and a Member API scoped to the logged-in customer. The API is
  authenticated with OAuth2 (authorization code for customers, password grant for
  staff automation) using public API clients created in the Momence dashboard, and
  covers members, sessions and bookings, memberships, checkout and sales, reports,
  appointments, addresses, and saved payment methods.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Fitness
- Wellness
- Studio Management
- Booking
- Scheduling
- Memberships
- Payments
- Class Management
