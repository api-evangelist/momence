                      from: 2026-01-01 00:00:00+00:00
                      to: 2026-01-30 00:00:00+00:00
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2HostCreateReportRunResponseDto'
          description: ''
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiV2HostCreateReportRunResponseDto'
      tags:
      - host
      security:
      - OAuth2: []
